<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="uke-battery">
    <allow own="org.senemos.Uke.Battery1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.senemos.Uke.Battery1" send_interface="org.senemos.Uke.Battery1" send_member="GetSnapshot"/>
    <allow send_destination="org.senemos.Uke.Battery1" send_interface="org.senemos.Uke.Battery1" send_member="GetCapabilities"/>
    <allow send_destination="org.senemos.Uke.Battery1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.senemos.Uke.Battery1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
