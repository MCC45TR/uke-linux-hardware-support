# Host composer applies this only to the explicit Core CDC debug profile.
# Original systemd debug-shell implementation; no project shell or Python app.
[Unit]
Description=Uke Core development root shell over CDC ACM
Requires=uke-cdc-acm.service
After=uke-cdc-acm.service
ConditionKernelCommandLine=senemos.debug=cdc-acm
ConditionPathExists=
ConditionPathExists=/sys/firmware/devicetree/base/compatible

[Service]
ExecStartPre=/usr/bin/uke-boot-status --cdc --require-tty --wait 15
TTYPath=/dev/ttyGS0
RestartSec=2
