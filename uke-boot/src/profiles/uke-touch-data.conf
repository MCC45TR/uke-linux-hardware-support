# Only the CSOT profile is qualified by the current kernel and input client.
# L preserves existing files and links; reference.bin is provisioned locally.
d /var/lib/uke-touch 0700 root root -
L /var/lib/uke-touch/normal.bin - - - - /usr/lib/firmware/qcom/uke/touch/csot/normal.bin
L /var/lib/uke-touch/config.ini - - - - /usr/lib/firmware/qcom/uke/touch/csot/config.ini
