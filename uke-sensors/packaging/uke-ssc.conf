# Copy calibration to RAM; FastRPC must never map the original persist tree.
# shortcut: keep registry changes until reboot; qualify reseeding and DSP recovery before enabling suspend.
d /run/uke-ssc/sensors 0700 root root -
C /run/uke-ssc/sensors/persist - root root - /mnt/vendor/persist/sensors/registry
C /run/uke-ssc/sensors/config - root root - /usr/share/uke-sensors/odm
C /run/uke-ssc/sensors/sns_reg.conf - root root - /usr/share/uke-sensors/sns_reg.conf
d /run/uke-ssc/dsp/adsp 0700 root root -
C /run/uke-ssc/dsp/adsp/sns_tppe.so - root root - /usr/lib/firmware/qcom/uke/sensors/sns_tppe.so
d /run/uke-ssc/socinfo 0700 root root -
C /run/uke-ssc/socinfo/hw_platform - root root - /sys/devices/soc0/hw_platform
C /run/uke-ssc/socinfo/platform_subtype - root root - /sys/devices/soc0/platform_subtype
C /run/uke-ssc/socinfo/platform_subtype_id - root root - /sys/devices/soc0/platform_subtype_id
C /run/uke-ssc/socinfo/platform_version - root root - /sys/devices/soc0/platform_version
C /run/uke-ssc/socinfo/soc_id - root root - /sys/devices/soc0/soc_id
C /run/uke-ssc/socinfo/revision - root root - /sys/devices/soc0/revision
