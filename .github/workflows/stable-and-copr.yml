name: Stable recovery release and COPR tracking
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
permissions:
  contents: write
concurrency:
  group: recovery-stable-tracking
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install official host verification tools
        run: sudo apt-get update && sudo apt-get install -y jq rpm lz4 cpio binutils ripgrep unzip
      - name: Fetch the latest eligible stable release
        run: make track-stable
      - name: Verify and publish changed stable inputs
        env:
          COPR_BUILD_HOOK: ${{ secrets.COPR_RECOVERY_BUILD_HOOK }}
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- manifests/release-lock.json packaging/uke-orangefox-recovery.spec; then exit 0; fi
          make audit
          # GITHUB_TOKEN pushes do not generate another workflow run or webhook.
          # This job explicitly requests the new COPR source build after push.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/release-lock.json packaging/uke-orangefox-recovery.spec
          git commit -m "Update verified stable Uke recovery release"
          git push origin HEAD:main
          test -n "$COPR_BUILD_HOOK"
          curl -fsS -X POST "$COPR_BUILD_HOOK" >/dev/null
