name: Ubuntu ARM64 test userspace qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  userspace:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bootstrap signed official Tenacious ARM64 userspace
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y debootstrap ubuntu-keyring gnupg curl jq
          sudo debootstrap --arch=arm64 --variant=minbase --components=main,universe --keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg tenacious "$RUNNER_TEMP/tenacious" https://ports.ubuntu.com/ubuntu-ports /usr/share/debootstrap/scripts/gutsy
          sudo tar -C "$RUNNER_TEMP/tenacious" -c . | docker import - uke-test-userspace:local
      - name: Verify existing public PPA archive key
        run: |
          expected=27A0465D56AF763E969F432D6A0B0B9CF4A769FB
          observed=$(curl -fsSL https://api.launchpad.net/devel/~mcs45tr/+archive/ubuntu/uke-linux-unstable | jq -er .signing_key_fingerprint)
          test "$observed" = "$expected"
          mkdir -p verified-key evidence
          keyring=$(mktemp -d)
          curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$expected" > "$keyring/archive.asc"
          gpg --homedir "$keyring" --batch --with-colons --show-keys "$keyring/archive.asc" > "$keyring/key.txt"
          test "$(awk -F: '$1=="pub" {n++} END {print n}' "$keyring/key.txt")" = 1
          test "$(awk -F: '$1=="fpr" {print $10; exit}' "$keyring/key.txt")" = "$expected"
          gpg --homedir "$keyring" --batch --dearmor < "$keyring/archive.asc" > verified-key/uke-linux-unstable.gpg
          printf '%s\n' "$expected" > evidence/ppa-signing-fingerprint.txt
          rm -rf "$keyring"
      - name: Qualify official Ubuntu and published PPA runtime packages
        run: |
          set -o pipefail
          docker run --rm --cap-drop=ALL --cap-add=CHOWN --cap-add=DAC_OVERRIDE --cap-add=FOWNER --cap-add=SETGID --cap-add=SETUID --cap-add=SETFCAP --cap-add=SYS_CHROOT \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$GITHUB_WORKSPACE/verified-key:/verified-key:ro" -v "$GITHUB_WORKSPACE/evidence:/evidence" \
            uke-test-userspace:local bash /repo/packaging/ubuntu/qualify-test-root.sh 2>&1 | tee evidence/userspace-install.log
      - name: Retain qualification evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tenacious-arm64-test-userspace
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Qualify dpkg provenance with stock ARM64 files only
        run: |
          mkdir -p host-evidence
          set -o pipefail
          docker run --rm --cap-drop=ALL --cap-add=CHOWN --cap-add=DAC_OVERRIDE --cap-add=FOWNER --cap-add=SETGID --cap-add=SETUID --cap-add=SETFCAP --cap-add=SYS_CHROOT \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$GITHUB_WORKSPACE/host-evidence:/evidence" \
            uke-test-userspace:local bash /repo/packaging/ubuntu/qualify-boot-provenance-host.sh 2>&1 | tee host-evidence/host-provenance.log
      - name: Retain host-only provenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tenacious-arm64-stock-boot-provenance
          path: host-evidence/
          retention-days: 7
          if-no-files-found: warn
