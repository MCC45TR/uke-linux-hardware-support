name: Track admitted stable support sources
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: support-stable-tracking
  cancel-in-progress: false
jobs:
  stable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install official host source tools
        run: sudo apt-get update && sudo apt-get install -y jq curl make rpm xz-utils lz4 cpio binutils ripgrep unzip libxml2-utils
      - name: Check XML validation prerequisites and policy rejection
        run: bash tests/xml-validation.sh
      - name: Verify eligible stable sources
        run: |
          make -C uke-desktop-packaging track-stable
          make validate
          if ! git diff --quiet -- uke-desktop-packaging/manifests/material-decoration.json; then
            make -C uke-desktop-packaging srpm PACKAGE=material-decoration
          fi
      - name: Publish changed source pins and request their COPR builds
        env:
          COPR_SUPPORT_BUILD_HOOK_BASE: ${{ secrets.COPR_SUPPORT_BUILD_HOOK_BASE }}
        run: |
          set -Eeuo pipefail
          changed=()
          git diff --quiet -- uke-desktop-packaging/manifests/material-decoration.json || changed+=(material-decoration)
          if ((${#changed[@]} == 0)); then exit 0; fi
          test -n "$COPR_SUPPORT_BUILD_HOOK_BASE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uke-desktop-packaging/manifests/material-decoration.json uke-desktop-packaging/packaging/material-decoration/material-decoration.spec
          git commit -m 'Track verified stable hardware support source releases'
          git push origin HEAD:main
          for package in "${changed[@]}"; do
            # An uncertain POST must be inspected, never retried automatically.
            curl -fsS --max-time 120 -X POST "$COPR_SUPPORT_BUILD_HOOK_BASE/$package/" >/dev/null
          done
