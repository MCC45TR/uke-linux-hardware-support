name: Rebuild support packages after common rule changes
on:
  push:
    branches: [main]
    paths:
      - '.copr/**'
      - 'uke-desktop-packaging/Makefile'
      - 'uke-desktop-packaging/src/**'
      - 'uke-desktop-packaging/manifests/**'
  workflow_dispatch:
    inputs:
      package:
        description: Reviewed COPR source package, or all
        required: true
        default: uke-core-meta
        type: choice
        options:
          - uke-core-meta
          - uke-boot-integration
          - uke-desktop-metas
          - uke-orangefox-recovery
          - material-decoration
          - plymouth-uke
          - at-spi2-core
          - gstreamer1
          - libaccounts-glib
          - libwacom
          - libstdcxx-uke-runtime
          - all
permissions:
  contents: read
concurrency:
  group: support-common-copr-dispatch
  cancel-in-progress: false
jobs:
  source-builds:
    runs-on: ubuntu-24.04
    steps:
      - name: Request reviewed source builds
        env:
          COPR_SUPPORT_BUILD_HOOK_BASE: ${{ secrets.COPR_SUPPORT_BUILD_HOOK_BASE }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.package }}
        run: |
          set -Eeuo pipefail
          test -n "$COPR_SUPPORT_BUILD_HOOK_BASE"
          packages=(uke-core-meta uke-desktop-metas uke-orangefox-recovery uke-boot-integration material-decoration plymouth-uke at-spi2-core gstreamer1 libaccounts-glib libwacom libstdcxx-uke-runtime)
          if [[ $EVENT == workflow_dispatch && $REQUESTED != all ]]; then
            case " $REQUESTED " in
              ' uke-core-meta '|' uke-desktop-metas '|' uke-orangefox-recovery '|' uke-boot-integration '|' material-decoration '|' plymouth-uke '|' at-spi2-core '|' gstreamer1 '|' libaccounts-glib '|' libwacom '|' libstdcxx-uke-runtime ') packages=("$REQUESTED");;
              *) echo 'Unreviewed COPR source package' >&2; exit 1;;
            esac
          fi
          for package in "${packages[@]}"; do
            curl -fsS --retry 2 -X POST "$COPR_SUPPORT_BUILD_HOOK_BASE/$package/" >/dev/null
            printf 'Requested %s source build\n' "$package"
          done
