name: Ubuntu Tenacious native ARM64 packages
on:
  workflow_dispatch:
    inputs:
      package:
        description: Reviewed source package, or all
        default: all
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.packages.outputs.value }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: packages
        env:
          SELECTED: ${{ inputs.package || 'all' }}
        run: |
          if [[ $SELECTED == all ]]; then
            packages=$(cut -f1 packaging/ubuntu/components.tsv | jq -Rsc 'split("\n")|map(select(length>0))')
          else
            awk -F '\t' -v p="$SELECTED" '$1==p {found=1} END {exit !found}' packaging/ubuntu/components.tsv
            packages=$(jq -nc --arg p "$SELECTED" '[$p]')
          fi
          echo "value=$packages" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bootstrap signed official Tenacious ARM64 archive
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo apt-get install -y debootstrap ubuntu-keyring
          sudo debootstrap --arch=arm64 --variant=minbase --components=main,universe --keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg tenacious "$RUNNER_TEMP/tenacious" https://ports.ubuntu.com/ubuntu-ports /usr/share/debootstrap/scripts/gutsy
          sudo tar -C "$RUNNER_TEMP/tenacious" -c . | docker import - uke-tenacious:local
          mkdir evidence
      - name: Build shared pinned source as unprivileged builder
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -o pipefail
          docker run --rm --cap-drop=ALL --cap-add=CHOWN --cap-add=DAC_OVERRIDE --cap-add=FOWNER --cap-add=SETGID --cap-add=SETUID --cap-add=SYS_CHROOT \
            -v "$GITHUB_WORKSPACE:/repo" -v "$GITHUB_WORKSPACE/evidence:/evidence" \
            uke-tenacious:local bash /repo/packaging/ubuntu/native-build.sh "$PACKAGE" 2>&1 | tee evidence/server-build.log
      - name: Retain packages and build evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tenacious-arm64-${{ matrix.package }}
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
