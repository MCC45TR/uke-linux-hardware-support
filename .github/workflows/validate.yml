name: Validate Uke hardware support
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install official host validation tools
        run: sudo apt-get update && sudo apt-get install -y jq g++ pkg-config qt6-base-dev device-tree-compiler
      - run: make validate && make test-native
