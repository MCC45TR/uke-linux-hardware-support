name: Validate Uke hardware support
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      before:
        description: Previous commit for a reviewed failed build-request retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hardware-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validation:
    name: Validate / ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [contracts, native, bus, repositories, interfaces, tui]
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:rawhide
    steps:
      - name: Install official host validation tools
        run: dnf5 -y install git curl jq gcc-c++ ncurses-devel libvterm-devel libasan libubsan make cmake cmake-rpm-macros extra-cmake-modules kf6-kcmutils-devel kf6-kcoreaddons-devel kf6-ki18n-devel gettext nodejs pkgconf-pkg-config qt6-qtbase-devel qt6-qtdeclarative-devel libplasma plasma5support kf6-kirigami dtc libdrm-devel systemd-devel systemd-udev umockdev-devel libselinux-devel selinux-policy-devel alsa-lib-devel jsoncpp-devel xfsprogs-devel e2fsprogs dosfstools f2fs-tools wayland-devel wayland-protocols-devel libdnf5-devel rpm-devel openssl-devel rpm-build rpm-sign gnupg2 createrepo_c systemd-rpm-macros 'pkgconfig(fdisk)' 'pkgconfig(zlib)' util-linux dbus-daemon
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Run the selected independent suite
        env:
          VALIDATION_SUITE: ${{ matrix.suite }}
        run: |
          set -Eeuo pipefail
          case "$VALIDATION_SUITE" in
            contracts) make validate; make -C packaging/families check ;;
            native) make test-native ;;
            bus) make -C uke-control check-bus check-sensor-proxy ;;
            repositories) make -C uke-control check-repositories check-copr-trigger ;;
            interfaces) make -C uke-desktop-metas test-applet test-applet-state test-applet-load; make -C plasma-uke-kcm check ;;
            tui) make -C uke-control check-client check-tui ;;
          esac
  request-build:
    needs: validation
    if: needs.validation.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:rawhide
    steps:
      - run: dnf5 -y install git curl jq
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Request changed source families after every required suite succeeds
        env:
          UKE_CONTROL_BEFORE: ${{ github.event.before || inputs.before }}
          UKE_CONTROL_COMMIT: ${{ github.sha }}
          COPR_SUPPORT_BUILD_HOOK_BASE: ${{ secrets.COPR_SUPPORT_BUILD_HOOK_BASE }}
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for family in $(jq -r '.families[].name' packaging/families/families.json); do
            UKE_COPR_FAMILY="$family" bash uke-control/host/request-copr.sh
          done
