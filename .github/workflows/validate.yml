name: Validate Uke hardware support
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      before:
        description: Previous commit for a reviewed failed build-request retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hardware-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:rawhide
    steps:
      - name: Install official source validation tools
        run: dnf5 -y install git curl jq make rpm-build rpm-sign gnupg2 createrepo_c systemd-rpm-macros binutils cpio xz tar diffutils gawk util-linux
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate source and packaging metadata
        run: make validate
      - run: make -C packaging/families check
      - name: Record the native build boundary
        run: echo 'Native compilation and package checks run in COPR; this workflow validates source only.' >> "$GITHUB_STEP_SUMMARY"
      - name: Request changed source families after validation
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          UKE_CONTROL_BEFORE: ${{ github.event.before || inputs.before }}
          UKE_CONTROL_COMMIT: ${{ github.sha }}
          COPR_SUPPORT_BUILD_HOOK_BASE: ${{ secrets.COPR_SUPPORT_BUILD_HOOK_BASE }}
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for family in $(jq -r '.families[].name' packaging/families/families.json); do
            UKE_COPR_FAMILY="$family" bash uke-control/host/request-copr.sh
          done
