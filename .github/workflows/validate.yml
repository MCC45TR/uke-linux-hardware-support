name: Validate Uke hardware support
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hardware-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:rawhide
    steps:
      - name: Install official host validation tools
        run: dnf5 -y install git curl jq gcc-c++ make pkgconf-pkg-config qt6-qtbase-devel dtc libdrm-devel systemd-devel libselinux-devel wayland-devel wayland-protocols-devel libdnf5-devel rpm-devel openssl-devel rpm-build rpm-sign gnupg2 createrepo_c systemd-rpm-macros
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: make validate && make test-native
      - name: Exercise signed repositories and the private sensor bus
        run: dnf5 -y install dbus-daemon && make -C uke-control check-repositories check-sensor-proxy check-copr-trigger
      - name: Request a changed Uke Control release after validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          UKE_CONTROL_BEFORE: ${{ github.event.before }}
          UKE_CONTROL_COMMIT: ${{ github.sha }}
          COPR_SUPPORT_BUILD_HOOK_BASE: ${{ secrets.COPR_SUPPORT_BUILD_HOOK_BASE }}
        run: bash uke-control/host/request-copr.sh
