name: Validate Uke hardware support
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      before:
        description: Previous commit for a reviewed failed build-request retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hardware-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:rawhide
    steps:
      - name: Install official host validation tools
        run: dnf5 -y install git curl jq gcc-c++ make pkgconf-pkg-config qt6-qtbase-devel qt6-qtdeclarative-devel libplasma plasma5support kf6-kirigami dtc libdrm-devel systemd-devel systemd-udev umockdev-devel libselinux-devel selinux-policy-devel alsa-lib-devel jsoncpp-devel xfsprogs-devel e2fsprogs dosfstools f2fs-tools wayland-devel wayland-protocols-devel libdnf5-devel rpm-devel openssl-devel rpm-build rpm-sign gnupg2 createrepo_c systemd-rpm-macros 'pkgconfig(fdisk)' 'pkgconfig(zlib)' util-linux dbus-daemon selinux-policy-devel
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: make validate && make test-native
      - run: make -C packaging/families check
      - name: Exercise signed repositories and the private sensor bus
        run: dnf5 -y install dbus-daemon && make -C uke-control check-repositories check-sensor-proxy check-copr-trigger
      - name: Request changed source families after validation
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          UKE_CONTROL_BEFORE: ${{ github.event.before || inputs.before }}
          UKE_CONTROL_COMMIT: ${{ github.sha }}
          COPR_SUPPORT_BUILD_HOOK_BASE: ${{ secrets.COPR_SUPPORT_BUILD_HOOK_BASE }}
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for family in $(jq -r '.families[].name' packaging/families/families.json); do
            UKE_COPR_FAMILY="$family" bash uke-control/host/request-copr.sh
          done
