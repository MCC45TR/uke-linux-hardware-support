<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="org.senemos.Uke.Motion1"/>
    <allow send_destination="org.senemos.Uke.Motion1" send_interface="org.senemos.Uke.Motion1"/>
    <allow send_destination="org.senemos.Uke.Motion1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
  <policy user="root"><allow own="org.senemos.Uke.Motion1"/></policy>
</busconfig>
