<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <selinux>
    <associate own="org.senemos.Uke.Rgb" context="system_u:object_r:uke_rgb_t:s0"/>
  </selinux>
  <policy context="default">
    <deny own="org.senemos.Uke.Rgb"/>
    <allow send_destination="org.senemos.Uke.Rgb" send_interface="org.senemos.Uke.Rgb1"/>
    <allow send_destination="org.senemos.Uke.Rgb" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
  <policy user="uke-rgb"><allow own="org.senemos.Uke.Rgb"/></policy>
</busconfig>
