# Passive speech processing for new implicit communication streams; raw stays available.
wireplumber.settings.schema = {
  uke.microphone.selection = {
    name = "Internal microphone channel"
    description = "auto preserves raw capture; manual affects new implicit mono/stereo streams"
    type = "string"
    default = "auto"
  }
  uke.microphone.processing = {
    name = "Microphone speech processing"
    description = "calls: communication streams; all: implicit mono/stereo; off: raw/manual routing"
    type = "string"
    default = "calls"
  }
  uke.microphone.agc = {
    name = "Microphone digital automatic gain control"
    description = "Optional WebRTC digital AGC; never changes physical ADC gain"
    type = "bool"
    default = false
  }
}
wireplumber.components = [
  { name = uke-microphone.lua, type = script/lua,
    provides = hooks.uke.microphone,
    requires = [ support.lua-scripting support.client-context ] }
]
wireplumber.profiles = {
  main = { hooks.uke.microphone = optional }
}
