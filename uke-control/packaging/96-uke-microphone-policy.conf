# Routing only; no source is created until an explicit manual preference is set.
wireplumber.settings.schema = {
  uke.microphone.selection = {
    name = "Internal microphone channel"
    description = "auto preserves raw capture; manual affects new implicit mono/stereo streams"
    type = "string"
    default = "auto"
  }
}
wireplumber.components = [
  { name = uke-microphone.lua, type = script/lua,
    provides = hooks.uke.microphone,
    requires = [ support.lua-scripting support.client-context ] }
]
wireplumber.profiles = {
  main = { hooks.uke.microphone = optional }
}
