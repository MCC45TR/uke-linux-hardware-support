[Unit]
Wants=uke-rtc-sync.timer
Wants=uke-rtc-counter-sync.timer

[Service]
# Create the trusted floor directory before ProtectSystem=strict takes effect.
StateDirectory=senemos/installation
StateDirectoryMode=0700
# Restore a verified disk floor before Chrony; save only kernel-synchronized UTC.
ExecStartPre=/usr/libexec/senemos-uke/uke-install-profile clock-restore
ExecStopPost=/usr/libexec/senemos-uke/uke-install-profile clock-save
ReadWritePaths=-/var/lib/senemos/installation
