# Explicit Core development profile. ESP32-S3 HID selects VT2 and types commands;
# journal forwarding is the single writer to the ESP32-S3 CDC channel.
[Unit]
Description=Uke Core development shell for ESP32-S3 HID and CDC logs
ConditionKernelCommandLine=senemos.debug=esp32-cdc
ConditionPathExists=
ConditionPathExists=/dev/tty2
ConditionPathExists=!/etc/initrd-release
After=systemd-journald.service

[Service]
ExecStartPre=/usr/bin/uke-boot-status --identity
TTYPath=/dev/tty2
StandardOutput=journal
StandardError=journal
SyslogIdentifier=uke-core-shell
Environment=TERM=dumb
RestartSec=2
