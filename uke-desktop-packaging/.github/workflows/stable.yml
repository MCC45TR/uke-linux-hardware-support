name: Material stable source tracking
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare official host source tools
        run: sudo apt-get update && sudo apt-get install -y jq curl make rpm xz-utils
      - name: Fetch and verify the published upstream stable source
        run: make track-stable && make validate && make srpm PACKAGE=material-decoration
      - name: Commit a changed stable pin and request its native build
        env:
          COPR_MATERIAL_BUILD_HOOK: ${{ secrets.COPR_MATERIAL_BUILD_HOOK }}
        run: |
          if git diff --quiet -- manifests/material-decoration.json packaging/material-decoration/material-decoration.spec; then
            exit 0
          fi
          test -n "$COPR_MATERIAL_BUILD_HOOK"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifests/material-decoration.json packaging/material-decoration/material-decoration.spec
          git commit -m 'Track a verified published Material Decoration release'
          git push
          curl -fsS --retry 2 -X POST "$COPR_MATERIAL_BUILD_HOOK" >/dev/null
