# Stereo left/right feed the measured top/bottom left/right TDM slots.
pcm.uke_speakers {
	@args [ CARD ]
	@args.CARD.type string
	type plug
	slave {
		format S16_LE
		rate 48000
		channels 2
		pcm {
			type route
			slave {
				pcm { @func concat strings [ "hw:" $CARD ",1" ] }
				channels 4
			}
			ttable {
				0.0 1
				0.2 1
				1.1 1
				1.3 1
			}
		}
	}
}
