# The protected THP raw-data interface is not a capture camera.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.bus-path = "platform-a90000.spi-cs-0"
        device.product.name = "Uke NT36532 raw THP"
      }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]
